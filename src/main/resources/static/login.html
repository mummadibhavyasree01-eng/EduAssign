<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EduAssign Portal</title>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card glass-panel">
      <div class="login-header">
        <div class="logo-area">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <h1>EduAssign</h1>
        <p>Access your subject assignment portal</p>
      </div>

      <form id="login-form">
        <div class="input-wrapper">
          <input type="email" id="email" placeholder=" " required autocomplete="username">
          <label for="email"><i class="fas fa-envelope icon-prefix"></i> Email Address</label>
        </div>

        <div class="input-wrapper">
          <input type="password" id="password" placeholder=" " required autocomplete="current-password">
          <label for="password"><i class="fas fa-lock icon-prefix"></i> Password</label>
          <span class="password-toggle" id="toggle-password">
            <i class="fas fa-eye"></i>
          </span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          <span>Sign In</span>
          <i class="fas fa-arrow-right"></i>
        </button>
      </form>
      
      <div class="portal-footer">
        <p>For administrative privileges or support, contact IT Admin.</p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/common.js?v=7"></script>
  <script src="js/login.js?v=7"></script>
</body>
</html>
